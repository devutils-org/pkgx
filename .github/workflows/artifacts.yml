name: Build reviewable release artifacts
# Manual runs upload reviewable artifacts only. Pushing a tag such as v0.1.0 also
# attests each archive's build provenance (Sigstore) and opens a draft release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            flavor: host
          - os: ubuntu-latest
            flavor: musl
          - os: macos-latest
            flavor: host
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches Cargo.toml
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME, but Cargo.toml says $version"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo test --workspace --locked
      - run: python3 scripts/test_package.py
      - name: Link the Linux GNU archive against glibc 2.17
        if: runner.os == 'Linux' && matrix.flavor == 'host'
        run: |
          python3 -m pip install --user ziglang==0.16.0
          cargo install cargo-zigbuild --version 0.23.4 --locked
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > "$HOME/.local/bin/zig"
          chmod +x "$HOME/.local/bin/zig"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build and package the selected target
        shell: bash
        env:
          BUILD_FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          build_target=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$BUILD_FLAVOR" = musl ]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
            build_target=x86_64-unknown-linux-musl
            rustup target add "$build_target"
          fi
          if [ "$RUNNER_OS" = Linux ] && [ "$BUILD_FLAVOR" = host ]; then
            cargo zigbuild --release --locked --target "$build_target.2.17" -p xpac-cli
            python3 -c 'import runpy, pathlib; runpy.run_path("scripts/distroproof/package.py")["glibc_floor"](pathlib.Path("target/x86_64-unknown-linux-gnu/release/xpac"))'
          else
            cargo build --release --locked --target "$build_target" -p xpac-cli
          fi
          rustc -vV > /tmp/xpac-rustc.txt
          python3 scripts/package.py \
            --binary "target/$build_target/release/xpac" \
            --target "$build_target" --rustc-info /tmp/xpac-rustc.txt --output-dir dist
          cd dist
          shasum -a 256 -c ./*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: xpac-${{ runner.os }}-${{ runner.arch }}-${{ matrix.flavor }}
          path: |
            dist/xpac-*.tar.gz
            dist/xpac-*.tar.gz.sha256
      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/xpac-*.tar.gz

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum xpac-*.tar.gz > SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "xpac $GITHUB_REF_NAME" --generate-notes
