name: Rust
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/test_package.py
  apt-containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [debian:bookworm-slim, ubuntu:24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p pkgx-cli
      - name: Validate native APT in disposable container
        env:
          CONTAINER_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "$PWD/target/x86_64-unknown-linux-musl/release/pkgx:/usr/local/bin/pkgx:ro" \
            -v "$PWD/tests/containers:/checks:ro" \
            "$CONTAINER_IMAGE" sh -c 'apt-get update && sh /checks/inspection.sh && sh /checks/transactions.sh && sh /checks/privilege.sh && sh /checks/privilege-pam.sh'

  native-inventory:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # The disposable Arch container needs sync databases before checks.
          - image: archlinux:base
            check: pacman -Sy --noconfirm && sh /checks/pacman.sh && sh /checks/pacman-transactions.sh
          - image: fedora:latest
            check: sh /checks/rpm.sh && sh /checks/dnf-transactions.sh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p pkgx-cli
      - name: Inspect disposable native package database
        env:
          CONTAINER_IMAGE: ${{ matrix.image }}
          CONTAINER_CHECK: ${{ matrix.check }}
        run: |
          docker run --rm \
            -v "$PWD/target/x86_64-unknown-linux-musl/release/pkgx:/usr/local/bin/pkgx:ro" \
            -v "$PWD/tests/containers:/checks:ro" \
            "$CONTAINER_IMAGE" sh -c "$CONTAINER_CHECK"
  recipe-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Ubuntu restricts unprivileged user namespaces through AppArmor by default.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo build --locked -p pkgx-cli
      - run: sh tests/sandbox/recipe-userns.sh target/debug/pkgx
      - run: sh tests/sandbox/files-userns.sh "$PWD/target/debug/pkgx"
  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p pkgx-cli -- providers --json
      - run: cargo run --locked -p pkgx-cli -- list --provider brew --json
      # The hosted runner is discarded after the job: real Homebrew transactions.
      - name: Validate native Homebrew transactions on the disposable runner
        env:
          PKGX_DISPOSABLE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          cargo build --locked -p pkgx-cli
          PATH="$PWD/target/debug:$PATH" sh tests/containers/brew-transactions.sh
      # Managed configuration files with a private HOME below the runner's temp.
      - name: Validate managed configuration files on the disposable runner
        env:
          PKGX_DISPOSABLE: '1'
        run: |
          PKGX_ROOT="$RUNNER_TEMP/pkgx-files" PKGX_BIN="$PWD/target/debug/pkgx" \
            sh tests/sandbox/files-checks.sh
